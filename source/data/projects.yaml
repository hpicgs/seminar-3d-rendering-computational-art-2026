- name: Unstill Life – Vita Perpetua
  url: https://yeji0205.github.io/unstil-life-yegi-park/
  img: unstill-life-vita-perpetua.jpg
  contributors:
    - name: Yegi Park
      username: yeji0205
  description: >
    The still life is a traditional art genre that depicts inanimate objects carefully arranged
    in a controlled space. This project extends the genre into a cosmic dimension. The room
    slowly darkens into outer space, and the objects drift into weightlessness before fading
    away entirely. Four objects stand for four forms of existence on Earth: a stone as inanimate
    matter, a flower as plant, a teddy bear as animal, and a wooden mannequin as human. Their
    quiet disappearance carries the central idea that, from a cosmic perspective, all things are
    equally transient. They appear briefly, dissolve, and return in a new form as part of an
    endless cycle.

- name: T-1003
  url: "https://sjayv.github.io/T-1003/"
  img: t-1003.png
  contributors:
    - name: Jonas Vinmann
      username: SJayV
  description: >
    This interactive 3D prototype centers on an abstract, non-anthropomorphic creature. It is caught
    in an endless cycle of composure breaking under the very gaze it tries so desperately to protect
    itself against. Its deceptively perfect surface cannot entirely conceal how fragile it remains
    underneath its facade. The moment it notices it is being observed, it bursts open, revealing its
    true self and scattering its distorted components through space. Only once it believes itself
    unobserved does it reassemble and resume its attempt to mask its undeniably alien nature. The demo
    invites viewers to reflect on how readily we project human emotions onto a purely artificial
    construct, and perhaps to recognize something of themselves in its Sisyphean effort.

- name: Lava Landscape
  url: "https://github.com/ShAlexHo/Cga_Lavalandschaft"
  img: lava-landscape.png
  contributors:
    - name: Shyue-Shyang Alexander Ho
      username: ShAlexHo
  description: >
    What happens to a still life that never stands still? Unstill Life: Lava Landscape invites
    you to slow down and explore a volcanic landscape where lava, sun, and ash shift almost
    imperceptibly. Metaballs give the glowing lava its soft, fluid forms. Touch the lava flow
    and see how the terrain responds.

